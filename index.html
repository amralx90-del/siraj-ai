
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d1c">
<title>NEXORA AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#090d1c;
 color:#fff;
 min-height:100vh;
 display:flex;
 justify-content:center;
}
.app{
 width:100%;
 max-width:650px;
 min-height:100vh;
 display:flex;
 flex-direction:column;
 padding:22px;
}
header{text-align:center;padding:35px 0 25px}
.logo{
 font-size:38px;
 font-weight:bold;
 letter-spacing:2px;
 background:linear-gradient(90deg,#49d8ff,#a78bfa);
 -webkit-background-clip:text;
 color:transparent;
}
.tagline{color:#9ba9c4;margin-top:10px}
.welcome{
 margin-top:35px;
 text-align:center;
 padding:25px 15px;
 border:1px solid #263653;
 border-radius:20px;
 background:#111a30;
}
.welcome h2{font-size:23px}
.welcome p{color:#aab7d0;line-height:1.8}
.messages{
 flex:1;
 overflow:auto;
 padding:15px 0;
}
.message{
 padding:13px 16px;
 margin:10px 0;
 border-radius:15px;
 line-height:1.7;
 max-width:90%;
 white-space:pre-wrap;
}
.bot{background:#17243c;margin-left:auto}
.user{background:#164b70;margin-right:auto}
.composer{
 display:flex;
 gap:9px;
 padding:12px;
 background:#111a30;
 border:1px solid #263653;
 border-radius:16px;
}
input{
 flex:1;
 min-width:0;
 background:transparent;
 border:0;
 outline:0;
 color:white;
 font-size:16px;
}
button{
 border:0;
 border-radius:12px;
 padding:12px 18px;
 color:white;
 background:#167bb5;
 font-weight:bold;
}
footer{text-align:center;color:#71809c;font-size:12px;padding:18px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">NEXORA AI</div>
<div class="tagline">ذكاء يتجاوز حدود المستقبل</div>
</header>

<div class="welcome" id="welcome">
<h2>مرحباً بك في NEXORA AI</h2>
<p>مساعدك الذكي للإبداع والمعرفة والعمل.<br>اكتب رسالتك وابدأ رحلتك معنا.</p>
</div>

<div class="messages" id="messages"></div>

<div class="composer">
<input id="question" type="text" placeholder="اكتب رسالتك هنا..." />
<button onclick="sendMessage()">إرسال</button>
</div>

<footer>© 2026 NEXORA AI — All rights reserved</footer>
</div>

<script>
function sendMessage(){
 const input=document.getElementById('question');
 const value=input.value.trim();
 if(!value)return;

 document.getElementById('welcome').style.display='none';
 const messages=document.getElementById('messages');

 const user=document.createElement('div');
 user.className='message user';
 user.textContent=value;
 messages.appendChild(user);

 const bot=document.createElement('div');
 bot.className='message bot';
 bot.textContent='مرحباً! تم استلام رسالتك بنجاح. سيتم ربط محرك الذكاء الاصطناعي قريباً.';
 messages.appendChild(bot);

 input.value='';
 messages.scrollTop=messages.scrollHeight;
}
document.getElementById('question').addEventListener('keydown',function(e){
 if(e.key==='Enter')sendMessage();
});
</script>
</body>
</html>
